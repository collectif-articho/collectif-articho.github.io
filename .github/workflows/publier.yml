# Construit le site avec Hugo et le publie sur GitHub Pages à chaque push sur main.
# Modèle : workflow officiel de GitHub pour Hugo. Version de Hugo épinglée ici (D9).
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0
      HUGO_CACHEDIR: ${{ github.workspace }}/.hugo_cache
    steps:
      - name: Installer Hugo
        run: |
          wget -q -O "$RUNNER_TEMP/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - uses: actions/checkout@v7
      - id: pages
        uses: actions/configure-pages@v6
      # Garde les photos déjà redimensionnées d'une publication à l'autre.
      - uses: actions/cache@v6
        with:
          path: |
            ${{ env.HUGO_CACHEDIR }}
            resources/_gen
          key: hugo-${{ github.run_id }}
          restore-keys: hugo-
      - name: Construire
        run: hugo --gc --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
