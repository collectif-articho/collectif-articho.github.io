    fields: *fiche

  - name: ateliers-sur-mesures
    label: Ateliers · Ateliers sur-mesures
    label_singular: fiche
    folder: content/ateliers/ateliers-sur-mesures
    media_folder: /assets/photos/ateliers/ateliers-sur-mesures/{{filename}}
    public_folder: /photos/ateliers/ateliers-sur-mesures/{{filename}}
    create: true
    extension: md
    format: frontmatter
    summary: "{{title}} · {{sous_titre}}"
    sortable_fields: [weight, title]
    editor: { preview: false }
    fields: *fiche

  - name: ligne-de-mobilier
    label: Mobiliers · Ligne de mobilier
    label_singular: meuble
    folder: content/mobiliers/ligne-de-mobilier
    media_folder: /assets/photos/mobiliers/ligne-de-mobilier/{{filename}}
    public_folder: /photos/mobiliers/ligne-de-mobilier/{{filename}}
    create: true
    extension: md
    format: frontmatter
    sortable_fields: [weight, title]
    editor: { preview: false }
    fields:
      - { name: title, label: Nom du meuble, widget: string, hint: "Exemple : Table basse" }
      - name: modalite
        label: Modalités de commande
        label_singular: ligne
        widget: list
        required: false
        hint: "Une ligne par modalité. Exemple : Sur commande, 1 pièce minimum"
        field: { name: ligne, label: Ligne, widget: string }
      - name: dimensions
        label: Dimensions
        label_singular: dimension
        widget: list
        required: false
        hint: "Une ligne par dimension. Exemple : Longueur 100 cm"
        field: { name: dimension, label: Dimension, widget: string }
      - name: materiaux
        label: Matériaux
        label_singular: matériau
        widget: list
        required: false
        hint: "Une ligne par matériau. Exemple : Issus du réemploi"
        field: { name: materiau, label: Matériau, widget: string }
      - name: photos
        label: Photos
        label_singular: photo
        widget: list
        min: 1
        hint: "La première est celle affichée d'abord. Glisser pour changer l'ordre."
        field: { name: photo, label: Photo, widget: image }
      - name: weight
        label: Ordre sur la page
        widget: number
        value_type: int
        required: false
        hint: "1 pour le placer en premier, 2 en deuxième… Vide : en fin de liste."
