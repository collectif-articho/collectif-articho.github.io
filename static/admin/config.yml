# Formulaires de Sveltia CMS, servis sous /admin/ (D12).
# Une collection par rubrique du site. Les champs d'une fiche sont décrits dans
# la première collection (&fiche) et réutilisés dans les suivantes (*fiche).
# Les _index.md de Hugo, qui décrivent les rubriques elles-mêmes, sont masqués
# par Sveltia.
backend:
  name: github
  repo: collectif-articho/collectif-articho.github.io
  branch: main

site_url: https://collectif-articho.github.io

# Nom de fichier des nouvelles fiches, donc leur URL : tiré du titre à la
# création, en ASCII sans accents, puis figé.
slug:
  encoding: ascii
  clean_accents: true

# Par défaut ; chaque collection range ses photos par fiche (voir plus bas).
media_folder: /assets/photos
public_folder: /photos

# Photos réduites dans le navigateur avant l'envoi. 2 000 px, la plus grande
# taille servie par les gabarits : l'API qu'utilise Sveltia coupe tout envoi de
# plus d'environ 5 s, donc chaque Mo compte sur une connexion lente (ROADMAP, Q2).
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2000
          height: 2000

collections:
  - name: amenagements
    label: Projets · Aménagements
    label_singular: fiche
    folder: content/projets/amenagements
    media_folder: /assets/photos/projets/amenagements/{{filename}}
    public_folder: /photos/projets/amenagements/{{filename}}
    create: true
    extension: md
    format: frontmatter
    summary: "{{title}} · {{sous_titre}}"
    sortable_fields: [weight, title]
    editor: { preview: false }
    fields: &fiche
      - name: title
        label: Titre
        widget: string
        hint: "En majuscules, comme les autres fiches. Exemple : LE LOPIN"
      - name: sous_titre
        label: Sous-titre
        widget: string
        hint: "Une ligne. Exemple : Aménagement extérieur de l'école du CEPROC"
      - { name: commanditaire, label: Commanditaire, widget: string, required: false }
      - name: date_projet
        label: Date
        widget: string
        required: false
        hint: "Exemples : 2022, juillet 2023, mars - juillet 2025"
      - name: localisation
        label: Localisation
        widget: string
        required: false
        hint: "Exemple : Paris 19e arrondissement (75)"
      - name: intervention
        label: Intervention
        widget: string
        required: false
        hint: "Exemple : conception et réalisation"
      - { name: materiaux_reemployes, label: Matériaux réemployés, widget: string, required: false }
      - { name: materiaux_neufs, label: Matériaux neufs, widget: string, required: false }
      - name: autres_infos
        label: Autres informations
        label_singular: information
        widget: list
        required: false
        hint: "Seulement si besoin : Collaboration, Type de projet, Partenaires…"
        summary: "{{fields.intitule}} : {{fields.valeur}}"
        fields:
          - { name: intitule, label: Intitulé, widget: string }
          - { name: valeur, label: Valeur, widget: string }
      - name: photos
        label: Photos
        label_singular: photo
        widget: list
        min: 1
        hint: "La première est la grande photo en haut de la fiche et la vignette des listes. Glisser pour changer l'ordre."
        field: { name: photo, label: Photo, widget: image }
      - { name: body, label: Texte, widget: markdown, required: false, editor_components: [] }
      - name: weight
        label: Ordre dans la rubrique
        widget: number
        value_type: int
        required: false
        hint: "1 pour la placer en premier, 2 en deuxième… Vide : en fin de liste."

  - name: signaletiques
    label: Projets · Signalétiques
    label_singular: fiche
    folder: content/projets/signaletiques
    media_folder: /assets/photos/projets/signaletiques/{{filename}}
    public_folder: /photos/projets/signaletiques/{{filename}}
    create: true
    extension: md
    format: frontmatter
    summary: "{{title}} · {{sous_titre}}"
    sortable_fields: [weight, title]
    editor: { preview: false }
    fields: *fiche

  - name: microarchitectures
    label: Projets · Microarchitectures
    label_singular: fiche
    folder: content/projets/microarchitectures
    media_folder: /assets/photos/projets/microarchitectures/{{filename}}
    public_folder: /photos/projets/microarchitectures/{{filename}}
    create: true
    extension: md
    format: frontmatter
    summary: "{{title}} · {{sous_titre}}"
    sortable_fields: [weight, title]
    editor: { preview: false }
    fields: *fiche

  - name: chantiers-participatifs
    label: Projets · Chantiers participatifs
    label_singular: fiche
    folder: content/projets/chantiers-participatifs
    media_folder: /assets/photos/projets/chantiers-participatifs/{{filename}}
    public_folder: /photos/projets/chantiers-participatifs/{{filename}}
    create: true
    extension: md
    format: frontmatter
    summary: "{{title}} · {{sous_titre}}"
    sortable_fields: [weight, title]
    editor: { preview: false }
    fields: *fiche

  - name: demarche-experimentale
    label: Projets · Démarche expérimentale
    label_singular: fiche
    folder: content/projets/demarche-experimentale
    media_folder: /assets/photos/projets/demarche-experimentale/{{filename}}
    public_folder: /photos/projets/demarche-experimentale/{{filename}}
    create: true
    extension: md
    format: frontmatter
    summary: "{{title}} · {{sous_titre}}"
    sortable_fields: [weight, title]
    editor: { preview: false }
    fields: *fiche

  - name: agencements
    label: Mobiliers · Agencements
    label_singular: fiche
    folder: content/mobiliers/agencements
    media_folder: /assets/photos/mobiliers/agencements/{{filename}}
    public_folder: /photos/mobiliers/agencements/{{filename}}
    create: true
    extension: md
    format: frontmatter
    summary: "{{title}} · {{sous_titre}}"
    sortable_fields: [weight, title]
    editor: { preview: false }
    fields: *fiche

  - name: ateliers-sur-mesures
    label: Ateliers · Ateliers sur-mesures
    label_singular: fiche
    folder: content/ateliers/ateliers-sur-mesures
    media_folder: /assets/photos/ateliers/ateliers-sur-mesures/{{filename}}
    public_folder: /photos/ateliers/ateliers-sur-mesures/{{filename}}
    create: true
    extension: md
    format: frontmatter
    summary: "{{title}} · {{sous_titre}}"
    sortable_fields: [weight, title]
    editor: { preview: false }
    fields: *fiche

  - name: ligne-de-mobilier
    label: Mobiliers · Ligne de mobilier
    label_singular: meuble
    folder: content/mobiliers/ligne-de-mobilier
    media_folder: /assets/photos/mobiliers/ligne-de-mobilier/{{filename}}
    public_folder: /photos/mobiliers/ligne-de-mobilier/{{filename}}
    create: true
    extension: md
    format: frontmatter
    sortable_fields: [weight, title]
    editor: { preview: false }
    fields:
      - { name: title, label: Nom du meuble, widget: string, hint: "Exemple : Table basse" }
      - name: modalite
        label: Modalités de commande
        label_singular: ligne
        widget: list
        required: false
        hint: "Une ligne par modalité. Exemple : Sur commande, 1 pièce minimum"
        field: { name: ligne, label: Ligne, widget: string }
      - name: dimensions
        label: Dimensions
        label_singular: dimension
        widget: list
        required: false
        hint: "Une ligne par dimension. Exemple : Longueur 100 cm"
        field: { name: dimension, label: Dimension, widget: string }
      - name: materiaux
        label: Matériaux
        label_singular: matériau
        widget: list
        required: false
        hint: "Une ligne par matériau. Exemple : Issus du réemploi"
        field: { name: materiau, label: Matériau, widget: string }
      - name: photos
        label: Photos
        label_singular: photo
        widget: list
        min: 1
        hint: "La première est celle affichée d'abord. Glisser pour changer l'ordre."
        field: { name: photo, label: Photo, widget: image }
      - name: weight
        label: Ordre sur la page
        widget: number
        value_type: int
        required: false
        hint: "1 pour le placer en premier, 2 en deuxième… Vide : en fin de liste."

  # Pages fixes : un formulaire par fichier. La mise en page est dans les
  # gabarits (D5) ; les champs de structure (url, layout…) ne sont pas dans les
  # formulaires et sont conservés par Sveltia à l'enregistrement.
  - name: pages
    label: Pages du site
    editor: { preview: false }
    files:
      - name: accueil
        label: Accueil
        file: content/_index.md
        media_folder: /assets/photos/pages/accueil
        public_folder: /photos/pages/accueil
        fields:
          - name: diaporama
            label: Diaporama
            label_singular: photo
            widget: list
            hint: "Les grandes photos qui défilent en haut de la page. Glisser pour changer l'ordre."
            field: { name: photo, label: Photo, widget: image }
          - { name: titre, label: Titre, widget: string }
          - { name: accroche, label: Accroche, widget: string, hint: "La ligne sous le titre." }
          - name: valeurs
            label: Les 4 activités
            label_singular: activité
            widget: list
            min: 4
            max: 4
            hint: "Affichées sous le titre, chacune avec un dessin d'artichaut."
            field: { name: valeur, label: Activité, widget: string }
          - name: offres
            label: Boutons
            label_singular: bouton
            widget: list
            hint: "Les grands boutons entre deux traits. Lien : une page du site (/pages/…) ou mailto:adresse pour un e-mail."
            summary: "{{fields.titre}} · {{fields.sous_titre}}"
            fields:
              - { name: titre, label: Titre, widget: string }
              - { name: sous_titre, label: Sous-titre, widget: string }
              - { name: lien, label: Lien, widget: string }
          - { name: texte_intro, label: Texte de présentation, widget: markdown, editor_components: [] }
          - { name: photo_accueil, label: Photo sous le texte de présentation, widget: image }
          - { name: texte_axes, label: Texte des 3 axes, widget: markdown, editor_components: [] }
          - { name: photo_equipe, label: Photo de l'équipe, widget: image }
          - { name: texte_fin, label: Texte sous la photo de l'équipe, widget: markdown, editor_components: [] }
          - name: presse
            label: Ils parlent de nous
            label_singular: article
            widget: list
            summary: "{{fields.nom}}"
            fields:
              - { name: nom, label: Nom du média, widget: string }
              - { name: image, label: Image, widget: image }
              - { name: lien, label: Lien vers l'article, widget: string }
          - name: soutiens
            label: Soutiens
            label_singular: soutien
            widget: list
            hint: "Un logo et, si besoin, un lien."
            fields:
              - { name: logo, label: Logo, widget: image }
              - { name: lien, label: Lien, widget: string, required: false }
          - name: soutiens_empiles
            label: Soutiens empilés en fin de liste
            label_singular: soutien
            widget: list
            required: false
            hint: "Logos très larges, affichés l'un au-dessus de l'autre après les soutiens."
            fields:
              - { name: logo, label: Logo, widget: image }
              - { name: lien, label: Lien, widget: string, required: false }
          - name: partenaires
            label: Partenaires
            label_singular: groupe de partenaires
            widget: list
            hint: "Un groupe par paragraphe. Dans un groupe, un nom par ligne ; un rôle se note entre parenthèses : Marion Bouchard (Architecte)."
            field: { name: groupe, label: Groupe, widget: text }

      - name: contact
        label: Contact
        file: content/contact.md
        fields:
          - { name: email, label: E-mail, widget: string }
          - name: reseaux
            label: Réseaux sociaux
            label_singular: réseau
            widget: list
            hint: "Affichés sur la page Contact et dans le pied de page de tout le site."
            summary: "{{fields.nom}}"
            fields:
              - { name: nom, label: Nom, widget: string }
              - { name: lien, label: Lien, widget: string }
              - { name: icone, label: Icône, widget: select, options: [instagram, facebook, linkedin] }
          - { name: texte_adresses, label: Texte avant les adresses, widget: string }
          - name: adresses
            label: Adresses
            label_singular: adresse
            widget: list
            hint: "Les points de la carte ne suivent pas : prévenir Louis si une adresse change."
            summary: "{{fields.nom}}"
            fields:
              - { name: nom, label: Nom du lieu, widget: string }
              - { name: adresse, label: Adresse, widget: text }

      - name: notre-offre
        label: Notre offre
        file: content/notre-offre.md
        media_folder: /static/documents
        public_folder: /documents
        fields:
          - { name: plaquette, label: Plaquette (PDF), widget: file }
          - { name: body, label: Texte, widget: markdown, editor_components: [] }

      - name: onglet-mobiliers
        label: Onglet Mobiliers
        file: content/mobiliers/_index.md
        media_folder: /assets/photos/pages/mobiliers
        public_folder: /photos/pages/mobiliers
        fields: &cartes
          - name: cartes
            label: Cartes
            label_singular: carte
            widget: list
            summary: "{{fields.titre}}"
            fields:
              - { name: titre, label: Titre, widget: string }
              - { name: sous_titre, label: Sous-titre, widget: text, required: false }
              - { name: image, label: Photo, widget: image }
              - { name: lien, label: Lien, widget: string, hint: "Une page du site, par exemple /pages/mobiliers/agencements.html" }

      - name: onglet-ateliers
        label: Onglet Ateliers
        file: content/ateliers/_index.md
        media_folder: /assets/photos/pages/ateliers
        public_folder: /photos/pages/ateliers
        fields: *cartes

      - name: ligne-de-mobilier-textes
        label: Ligne de mobilier, textes de la page
        file: content/mobiliers/ligne-de-mobilier/_index.md
        media_folder: /assets/photos/mobiliers/ligne-de-mobilier
        public_folder: /photos/mobiliers/ligne-de-mobilier
        fields:
          - { name: texte_avant, label: Texte avant les meubles, widget: markdown, editor_components: [] }
          - { name: texte_apres, label: Texte après les meubles, widget: markdown, editor_components: [] }
          - { name: photo, label: Photo, widget: image, required: false }
          - { name: texte_fin, label: Texte sous la photo, widget: markdown, editor_components: [] }

      - name: a-propos
        label: À propos
        file: content/a-propos.md
        fields: &texte
          - { name: title, label: Titre, widget: string }
          - name: body
            label: Texte
            widget: markdown
            editor_components: []
            hint: "Intertitres : « Titre 2 » pour une partie, « Titre 3 » pour une sous-partie."

      - name: mentions-legales
        label: Mentions légales
        file: content/mentions-legales.md
        fields: *texte

      - name: conditions-generales
        label: Conditions générales
        file: content/conditions-generales.md
        fields: *texte
