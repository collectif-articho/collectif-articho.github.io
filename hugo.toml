  url = "/pages/contact.html"
  weight = 4

# Un retour à la ligne saisi dans un texte reste un retour à la ligne : c'est ce
# qu'attend quelqu'un qui écrit dans un formulaire.
[markup.goldmark.renderer]
  hardWraps = true
